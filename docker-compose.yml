version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nav_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-navegador_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: nav_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
    container_name: nav_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  scraper:
    build: 
      context: ./scraper
    container_name: nav_scraper
    env_file:
      - .env
    volumes:
      - ./scraper:/app
    depends_on:
      - db
    command: tail -f /dev/null 

volumes:
  postgres_data:
